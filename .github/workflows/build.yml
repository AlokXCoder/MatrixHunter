name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify Python version
      run: |
        python --version
        which python
        python3 --version

    - name: Install Buildozer and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache libltdl-dev
        python -m pip install --upgrade "pip<24"
        pip uninstall -y sh || true
        pip install "sh<2.0"
        pip install buildozer==1.5.0
        pip install "cython==0.29.36"
        pip install "virtualenv<21"
        pip install "python-for-android==2024.01.21"
        python -m pip show python-for-android
        python -c "import pythonforandroid; print('P4A Path:', pythonforandroid.__file__)"
        buildozer --version
        python -m pip list

    - name: Build APK
      run: |
        export CXXFLAGS="${CXXFLAGS} -std=c++17"
        export CFLAGS="${CFLAGS} -std=gnu11"
        export P4A_LOG_LEVEL=2
        # Ensure a clean state to prevent old Python/NDK caches from breaking the build
        rm -rf .buildozer
        rm -rf ~/.buildozer
        rm -rf ~/.cache/pip
        # Accept the Android SDK license automatically
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MatrixHunterUniverse-APK
        path: bin/*.apk
