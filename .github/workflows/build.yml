name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          git unzip wget \
          libncurses5 libncurses5-dev \
          libstdc++6 zlib1g \
          openjdk-17-jdk \
          build-essential ccache \
          autoconf automake libtool

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Accept Android SDK licenses
      run: |
        # Pre-create license acceptance files so sdkmanager never prompts interactively.
        # These are the official Google license hashes for Android SDK packages.
        mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"

        printf '%s\n' \
          '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
          '8933bad161af4178b1185d1a37fbf41ea5269c55' \
          'd56f5187479451eabf01fb78af6dfcb131a6481e' \
          > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"

        printf '%s\n' \
          '84831b9409646a918e30573bab4c9c91346d8abd' \
          > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license"

        printf '%s\n' \
          '33b6a2b64607f11b759f320ef9dff4ae5c47d97a' \
          > "$HOME/.buildozer/android/platform/android-sdk/licenses/google-gdk-license"

    - name: Build Android APK
      run: buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MatrixHunterUniverse-APK
        path: bin/*.apk
