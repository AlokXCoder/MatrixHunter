name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          git unzip wget \
          libncurses5 libncurses5-dev \
          libstdc++6 zlib1g \
          openjdk-17-jdk \
          build-essential ccache \
          autoconf automake libtool

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Set up Android SDK + Accept licenses
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR"

        # ── Download Android Command Line Tools ──────────────────────────
        # (This is where sdkmanager lives in modern Android SDK)
        wget -q \
          "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
          -O /tmp/cmdline-tools.zip

        # ── Extract to the SDK directory ─────────────────────────────────
        mkdir -p "$SDK_DIR/cmdline-tools"
        unzip -q /tmp/cmdline-tools.zip -d "$SDK_DIR/cmdline-tools"
        # Google names the inner folder "cmdline-tools" — rename to "latest"
        mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"

        # ── Symlink old path → new path ──────────────────────────────────
        # Buildozer's internal code looks for the OLD path: tools/bin/sdkmanager
        # The new location is: cmdline-tools/latest/bin/sdkmanager
        # This symlink makes Buildozer find it at the old location.
        mkdir -p "$SDK_DIR/tools/bin"
        ln -sf \
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
          "$SDK_DIR/tools/bin/sdkmanager"

        SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

        # ── Accept all SDK licenses non-interactively ────────────────────
        yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses || true

        # ── Pre-install required SDK components ──────────────────────────
        "$SDKMANAGER" --sdk_root="$SDK_DIR" \
          "build-tools;34.0.0" \
          "platforms;android-33" \
          "platform-tools"

    - name: Build Android APK
      run: buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MatrixHunterUniverse-APK
        path: bin/*.apk
